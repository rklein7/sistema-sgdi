{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1 class="page-title">Editar Demanda</h1>

    <form method="POST" action="/editar/{{ demanda['id'] }}">
        <div class="field">
            <label for="titulo">Título</label>
            <input id="titulo" type="text" name="titulo" value="{{ demanda['titulo'] }}" required>
        </div>

        <div class="field">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="5">{{ demanda['descricao'] }}</textarea>
        </div>

        <div class="field">
            <label for="solicitante">Solicitante</label>
            <input id="solicitante" type="text" name="solicitante" value="{{ demanda['solicitante'] }}" required>
        </div>

        <div class="field">
            <label for="data_criacao">Data de criação</label>
            <input id="data_criacao" type="text" value="{{ demanda['data_criacao'] }}" disabled>
        </div>

        <div class="field">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade">
                {% for p in prioridades %}
                    <option value="{{ p }}"
                        {% if p == demanda['prioridade'] %}selected{% endif %}
                        {% if p == 'Alta' and demanda['prioridade'] != 'Alta' %}disabled{% endif %}
                        {% if p == 'Média' and demanda['prioridade'] == 'Baixa' %}disabled{% endif %}
                    >
                        {{ p }}
                        {% if p == 'Alta' and demanda['prioridade'] != 'Alta' %}(não permitido){% endif %}
                        {% if p == 'Média' and demanda['prioridade'] == 'Baixa' %}(não permitido){% endif %}
                    </option>
                {% endfor %}
            </select>
            <small>A prioridade só pode ser reduzida.</small>
        </div>

        <div class="form-actions">
            <button type="submit">Atualizar</button>
            <a class="button button--secondary" href="/">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
