{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1 class="page-title">Nova Demanda</h1>

    <form method="POST" action="/nova_demanda">
        <div class="field">
            <label for="titulo">Título</label>
            <input id="titulo" type="text" name="titulo" required>
        </div>

        <div class="field">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="5"></textarea>
        </div>

        <div class="field">
            <label>Solicitante</label>
            <p class="readonly-value">{{ session['usuario_nome'] }}</p>
        </div>

        <div class="field">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade">
                {% for p in prioridades %}
                    <option value="{{ p }}" {% if p == 'Média' %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
            <small>Após a criação, a prioridade só pode ser reduzida.</small>
        </div>

        <div class="form-actions">
            <button type="submit">Salvar</button>
            <a class="button button--secondary" href="/">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
